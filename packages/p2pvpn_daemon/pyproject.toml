[project]
name = "p2pvpn-daemon"
version = "0.2.0"
description = "P2P L2 VPN daemon (model layer)"
requires-python = ">=3.10"
dependencies = [
    "p2pvpn-common",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]

[tool.uv.sources]
p2pvpn-common = { path = "../p2pvpn_common", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["p2pvpn_daemon*"]
